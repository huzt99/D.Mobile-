<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>فاحص الأجهزة</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>🩺 فاحص الأجهزة</h1><p id="sub">فحص الموبايل: البطارية، الحساسات، اللمس، الشاشة، الصوت، الكاميرا</p></header>

<nav>
  <button class="tab on" data-t="quick">فحص سريع</button>
  <button class="tab" data-t="manual">اختبارات يدوية</button>
  <button class="tab" data-t="report">التقرير</button>
</nav>

<main>
  <section id="quick" class="pane on">
    <button class="big" id="runQuick">▶ ابدأ الفحص السريع</button>
    <p class="hint">يفحص البطارية والحرارة والتخزين والرام والحساسات والشبكة تلقائيًا.</p>
  </section>

  <section id="manual" class="pane">
    <p class="hint">هذي اختبارات تحتاج عينك أو إيدك. نتيجة كل اختبار تنضاف للتقرير.</p>
    <div class="grid">
      <button data-test="touch">👆 اللمس</button>
      <button data-test="screen">🖥 الشاشة (ألوان/بكسلات)</button>
      <button data-test="speaker">🔊 السماعة</button>
      <button data-test="mic">🎤 المايك</button>
      <button data-test="camBack">📷 الكاميرا الخلفية</button>
      <button data-test="camFront">🤳 الكاميرا الأمامية</button>
      <button data-test="vibrate">📳 الاهتزاز</button>
      <button data-test="sensors">🧭 الحساسات (حركة/إضاءة/قرب)</button>
    </div>
  </section>

  <section id="report" class="pane">
    <div id="summary"></div>
    <div id="list"></div>
    <div class="row">
      <button id="copy">📋 نسخ التقرير</button>
      <button id="clear" class="ghost">مسح النتائج</button>
    </div>
    <textarea id="txt" readonly></textarea>
  </section>
</main>

<div id="overlay" hidden></div>
<script src="app.js"></script>
</body>
</html>
